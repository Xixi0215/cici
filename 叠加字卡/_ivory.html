<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "KaiLocal"; src: local("KaiTi"), local("楷体"); }
  html,body{margin:0;padding:0;background:transparent}
  .card{width:1080px;height:1920px;position:relative;background:transparent}
  .inner{position:absolute;left:0;right:0;top:790px;text-align:center}
  .en{font-family:"Ink Free","Segoe Print","Segoe Script",cursive;
       font-size:66px;letter-spacing:.14em;line-height:1.1;white-space:nowrap;
       text-transform:uppercase;opacity:.94}
  .ul{display:block;margin:-2px auto 0;color:inherit}
  .cn{font-family:"KaiLocal","KaiTi","楷体","STKaiti",serif;
       font-size:72px;letter-spacing:.1em;margin-top:18px;opacity:.96}
  .rule{width:260px;height:2px;background:currentColor;opacity:.45;margin:56px auto 0}
  .brand{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
          font-size:24px;letter-spacing:.34em;margin-top:22px;opacity:.8}
</style></head><body>
<section class="card" style="color:#f7f3ea">
  <div class="inner">
    <div class="en">NOTHING TO RUSH FOR</div>
    <svg class="ul" width="1080" height="46" viewBox="0 0 1080 46"><path d="M 300 24 C 380 16, 470 30, 560 22 S 720 14, 800 26" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/></svg>
    <div class="cn">今天不赶时间</div>
    
  </div>
</section>
<section class="card" style="color:#f7f3ea">
  <div class="inner">
    <div class="en">CLEAN IS A FEELING</div>
    <svg class="ul" width="1080" height="46" viewBox="0 0 1080 46"><path d="M 300 24 C 380 16, 470 30, 560 22 S 720 14, 800 26" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/></svg>
    <div class="cn">干净是洗给自己看的</div>
    
  </div>
</section>
<section class="card" style="color:#f7f3ea">
  <div class="inner">
    <div class="en">SOFT ISN'T WEAK</div>
    <svg class="ul" width="1080" height="46" viewBox="0 0 1080 46"><path d="M 300 24 C 380 16, 470 30, 560 22 S 720 14, 800 26" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/></svg>
    <div class="cn">柔软不是软弱</div>
    
  </div>
</section>
<section class="card" style="color:#f7f3ea">
  <div class="inner">
    <div class="en">STAY A LITTLE LONGER</div>
    <svg class="ul" width="1080" height="46" viewBox="0 0 1080 46"><path d="M 300 24 C 380 16, 470 30, 560 22 S 720 14, 800 26" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/></svg>
    <div class="cn">再赖一会儿</div>
    
  </div>
</section>
<section class="card" style="color:#f7f3ea">
  <div class="inner">
    <div class="en">LAZY SUNDAY MORNING</div>
    <svg class="ul" width="1080" height="46" viewBox="0 0 1080 46"><path d="M 300 24 C 380 16, 470 30, 560 22 S 720 14, 800 26" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/></svg>
    <div class="cn">慵懒周末</div>
    <div class="rule"></div><div class="brand">MAISON MARGIELA · REPLICA</div>
  </div>
</section>
</body></html>
